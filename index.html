<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance Database and Comparison Maker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Pustaka SheetJS untuk Ekspor ke Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    
    <style>
        .detail-row {
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 0.75rem;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
            color: #374151;
        }
        .detail-label {
            font-weight: 700;
            color: #000;
            margin-right: 0.25rem;
        }
        .benefit-label {
            font-weight: 700;
            color: #000;
            display: block;
            margin-top: 0.5rem;
        }
        .benefit-value {
            color: #4b5563;
        }
        /* Styling untuk scrollbar custom di dropdown */
        .dropdown-content::-webkit-scrollbar {
            width: 6px;
        }
        .dropdown-content::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans pb-24">

    <!-- Navbar Header -->
    <header class="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid me-2 fa-shield-halved"></i> Insurance Database and Comparison Maker
                <!-- Link Buka Google Sheets -->
                <a href="https://docs.google.com/spreadsheets/d/1NF4sv1CT_C4Vv6tJC5ppplVir3abi8_9GYHAwhdM8YI/edit" target="_blank" title="Buka Master Database" class="ml-2 text-blue-300 hover:text-white transition">
                    <i class="fa-solid fa-arrow-up-right-from-square text-sm"></i>
                </a>
            </h1>
            <span class="text-xs bg-blue-800 px-3 py-1 rounded-full text-blue-200" id="totalProductCount">Memuat data...</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6">
        <!-- Filter & Search Bar -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col md:flex-row gap-3 items-center">
            <!-- Search Box -->
            <div class="relative w-full md:w-64 shrink-0">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400"></i>
                <input type="text" id="searchInput" oninput="filterData()" placeholder="Cari nama produk..." 
                       class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <!-- Custom Multi-Select Dropdowns (Excel Style) -->
            <div class="flex flex-wrap gap-2 w-full justify-end" id="filterContainer">
                
                <!-- Filter Kategori (Konven/Syariah/HS) -->
                <div class="relative custom-select">
                    <button class="w-full md:w-auto min-w-[140px] border text-sm rounded-lg px-3 py-2 bg-white text-gray-700 text-left flex justify-between items-center hover:bg-gray-50 transition" onclick="toggleDropdown('categoryDropdown', event)">
                        <span id="categoryBtnText" class="truncate font-medium">Semua Kategori</span>
                        <i class="fa-solid fa-chevron-down text-xs ml-2 text-gray-400"></i>
                    </button>
                    <div id="categoryDropdown" class="dropdown-content hidden absolute right-0 z-50 mt-1 w-56 bg-white border rounded-lg shadow-xl max-h-60 overflow-y-auto p-2"></div>
                </div>

                <!-- Filter Perusahaan -->
                <div class="relative custom-select">
                    <button class="w-full md:w-auto min-w-[160px] border text-sm rounded-lg px-3 py-2 bg-white text-gray-700 text-left flex justify-between items-center hover:bg-gray-50 transition" onclick="toggleDropdown('companyDropdown', event)">
                        <span id="companyBtnText" class="truncate font-medium">Semua Perusahaan</span>
                        <i class="fa-solid fa-chevron-down text-xs ml-2 text-gray-400"></i>
                    </button>
                    <div id="companyDropdown" class="dropdown-content hidden absolute right-0 z-50 mt-1 w-56 bg-white border rounded-lg shadow-xl max-h-60 overflow-y-auto p-2"></div>
                </div>

                <!-- Filter Tipe Produk -->
                <div class="relative custom-select">
                    <button class="w-full md:w-auto min-w-[160px] border text-sm rounded-lg px-3 py-2 bg-white text-gray-700 text-left flex justify-between items-center hover:bg-gray-50 transition" onclick="toggleDropdown('typeDropdown', event)">
                        <span id="typeBtnText" class="truncate font-medium">Semua Tipe</span>
                        <i class="fa-solid fa-chevron-down text-xs ml-2 text-gray-400"></i>
                    </button>
                    <div id="typeDropdown" class="dropdown-content hidden absolute right-0 z-50 mt-1 w-56 bg-white border rounded-lg shadow-xl max-h-60 overflow-y-auto p-2"></div>
                </div>

                <!-- Filter Channel -->
                <div class="relative custom-select">
                    <button class="w-full md:w-auto min-w-[150px] border text-sm rounded-lg px-3 py-2 bg-white text-gray-700 text-left flex justify-between items-center hover:bg-gray-50 transition" onclick="toggleDropdown('channelDropdown', event)">
                        <span id="channelBtnText" class="truncate font-medium">Semua Channel</span>
                        <i class="fa-solid fa-chevron-down text-xs ml-2 text-gray-400"></i>
                    </button>
                    <div id="channelDropdown" class="dropdown-content hidden absolute right-0 z-50 mt-1 w-56 bg-white border rounded-lg shadow-xl max-h-60 overflow-y-auto p-2"></div>
                </div>

                <!-- Filter Currency -->
                <div class="relative custom-select">
                    <button class="w-full md:w-auto min-w-[140px] border text-sm rounded-lg px-3 py-2 bg-white text-gray-700 text-left flex justify-between items-center hover:bg-gray-50 transition" onclick="toggleDropdown('currencyDropdown', event)">
                        <span id="currencyBtnText" class="truncate font-medium">Semua Mata Uang</span>
                        <i class="fa-solid fa-chevron-down text-xs ml-2 text-gray-400"></i>
                    </button>
                    <div id="currencyDropdown" class="dropdown-content hidden absolute right-0 z-50 mt-1 w-56 bg-white border rounded-lg shadow-xl max-h-60 overflow-y-auto p-2"></div>
                </div>

            </div>
        </div>

        <!-- Tampilan Loading -->
        <div id="loadingIndicator" class="text-center py-12 text-gray-500">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-blue-500"></i>
            <p>Menghubungkan & Mensinkronisasi Tab Data...</p>
        </div>

        <!-- AppSheet Deck-Style Grid -->
        <div id="deckGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 hidden"></div>
    </main>

    <!-- Floating Comparison Bar -->
    <div id="compareBar" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-4 transition-all transform translate-y-32 z-40">
        <span class="text-sm font-medium whitespace-nowrap"><span id="selectedCount" class="font-bold text-blue-400">0</span> produk dipilih</span>
        <button onclick="selectAllVisible()" class="text-gray-300 hover:text-white text-xs font-semibold px-2 py-1 rounded transition border border-gray-600 hover:border-gray-400 whitespace-nowrap">
            <i class="fa-solid fa-check-double me-1"></i> Pilih Semua
        </button>
        <button onclick="openComparisonModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-1.5 rounded-full transition whitespace-nowrap">
            <i class="fa-solid fa-columns me-1"></i> Bandingkan
        </button>
        <button onclick="clearSelection()" class="text-gray-400 hover:text-white text-xs underline whitespace-nowrap">Batal</button>
    </div>

    <!-- Modal Perbandingan Side-by-Side -->
    <div id="compareModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-6xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 bg-gray-900 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-code-compare me-2 text-blue-400"></i>Perbandingan Produk</h3>
                <div class="flex gap-4 items-center">
                    <button onclick="downloadComparisonExcel()" class="bg-green-600 hover:bg-green-500 text-white text-xs font-bold px-3 py-1.5 rounded flex items-center gap-1 transition">
                        <i class="fa-solid fa-file-excel"></i> Ekspor Excel
                    </button>
                    <button onclick="closeComparisonModal()" class="text-gray-400 hover:text-white text-xl ml-2">&times;</button>
                </div>
            </div>
            <div class="p-4 overflow-x-auto overflow-y-auto flex-1" id="modalTableContainer"></div>
        </div>
    </div>

    <!-- Modal Detail Single Produk -->
    <div id="detailModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 bg-blue-900 text-white flex justify-between items-center">
                <h3 id="detailTitle" class="font-bold text-lg">Detail Produk</h3>
                <button onclick="closeDetailModal()" class="text-gray-300 hover:text-white text-xl">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto" id="detailBody"></div>
        </div>
    </div>

    <!-- SCRIPT LOGIKA UTAMA WEB -->
    <script>
        const SHEET_ID = "1NF4sv1CT_C4Vv6tJC5ppplVir3abi8_9GYHAwhdM8YI";
        const SHEET_TABS = ["Konven", "Syariah", "HS"]; // Nama tab di Google Sheets harus persis seperti ini

        let products = [];
        let selectedProductIds = [];
        let currentlyVisibleProducts = []; 
        let currentComparisonFeatures = [];
        let currentComparisonProducts = [];

        // State untuk menyimpan filter ganda yang dipilih
        let activeFilters = {
            category: [],
            company: [],
            type: [],
            channel: [],
            currency: []
        };

        // --- SISTEM DROPDOWN MULTI-SELECT ---
        function toggleDropdown(id, event) {
            event.stopPropagation();
            document.querySelectorAll('.dropdown-content').forEach(el => {
                if (el.id !== id) el.classList.add('hidden');
            });
            document.getElementById(id).classList.toggle('hidden');
        }

        // Tutup dropdown jika klik area luar
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.custom-select')) {
                document.querySelectorAll('.dropdown-content').forEach(el => el.classList.add('hidden'));
            }
        });

        // Hentikan penutupan saat mengeklik checkbox di dalam dropdown
        document.querySelectorAll('.dropdown-content').forEach(el => {
            el.addEventListener('click', (e) => e.stopPropagation());
        });

        function updateFilterState(filterKey, value, isChecked) {
            if (isChecked) {
                activeFilters[filterKey].push(value);
            } else {
                activeFilters[filterKey] = activeFilters[filterKey].filter(v => v !== value);
            }
            updateFilterButtonText(filterKey);
            filterData();
        }

        function updateFilterButtonText(key) {
            const btn = document.getElementById(`${key}BtnText`);
            const count = activeFilters[key].length;
            const defaultLabels = {
                category: "Semua Kategori",
                company: "Semua Perusahaan",
                type: "Semua Tipe",
                channel: "Semua Channel",
                currency: "Semua Mata Uang"
            };

            if (count === 0) {
                btn.textContent = defaultLabels[key];
                btn.classList.remove("text-blue-600", "font-bold");
            } else if (count === 1) {
                btn.textContent = activeFilters[key][0];
                btn.classList.add("text-blue-600", "font-bold");
            } else {
                btn.textContent = `${count} Dipilih`;
                btn.classList.add("text-blue-600", "font-bold");
            }
        }

        function buildDropdownUI(filterKey, optionsArray) {
            const container = document.getElementById(`${filterKey}Dropdown`);
            container.innerHTML = "";
            optionsArray.forEach(opt => {
                const label = document.createElement('label');
                label.className = "flex items-start space-x-3 p-2 hover:bg-gray-100 cursor-pointer rounded text-sm text-gray-700 transition";
                label.innerHTML = `
                    <input type="checkbox" value="${opt}" class="mt-0.5 rounded text-blue-600 focus:ring-blue-500 w-4 h-4 accent-blue-600 cursor-pointer" 
                           onchange="updateFilterState('${filterKey}', this.value, this.checked)">
                    <span class="flex-1">${opt}</span>
                `;
                container.appendChild(label);
            });
        }

        // --- HELPER FUNCTIONS ---
        function isEmptyVal(val) {
            if (!val) return true;
            const str = String(val).trim();
            return str === "" || str === "-" || str === "N/A" || str === "null" || str === "undefined";
        }

        function formatListText(val) {
            if (isEmptyVal(val)) return "-";
            let text = String(val).trim();
            text = text.replace(/\r\n|\r|\n/g, '<br>');
            text = text.replace(/\s+-\s+(?=[A-Za-z])/g, '<br>- ');
            return text;
        }

        function getChannelIcon(channelName) {
            const channel = channelName.toLowerCase();
            if (channel.includes("bancassurance")) return "fa-building-columns";
            if (channel.includes("agency") || channel.includes("agen")) return "fa-user-tie";
            if (channel.includes("direct")) return "fa-paper-plane"; 
            if (channel.includes("corporate") || channel.includes("group")) return "fa-users";
            return "fa-diagram-project";
        }

        // --- PENARIKAN DATA BANYAK SHEET (MULTI-SHEET FETCH) ---
        let sheetsProcessed = 0;
        let sheetsFailed = 0;

        document.addEventListener("DOMContentLoaded", () => {
            // Kita jalankan script pengambilan per tiap tab sheet secara paralel
            SHEET_TABS.forEach((tabName, index) => {
                // Buat fungsi global unik per tab
                window[`prosesDataSheet${index}`] = function(jsonData) {
                    processSheetData(jsonData, tabName);
                    checkAllSheetsLoaded();
                };

                const script = document.createElement('script');
                script.onerror = () => {
                    console.warn(`Gagal memuat tab: ${tabName}. Pastikan nama tab persis ada di Sheets.`);
                    sheetsFailed++;
                    checkAllSheetsLoaded();
                };
                script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(tabName)}&headers=1&tqx=responseHandler:prosesDataSheet${index}`;
                document.body.appendChild(script);
            });
        });

        function processSheetData(jsonData, categoryName) {
            try {
                let cols = jsonData.table.cols.map(c => c ? (c.label || "").trim() : ""); 
                let rows = jsonData.table.rows;

                const hasValidLabels = cols.some(l => l && l !== "" && !/^[A-Z]+$/.test(l));
                if (!hasValidLabels && rows.length > 0) {
                    cols = rows[0].c.map(cell => (cell && cell.v !== null && cell.v !== undefined) ? String(cell.v).trim() : "");
                    rows = rows.slice(1);
                }

                rows.forEach((row) => {
                    if (!row || !row.c) return;

                    const getVal = (colName) => {
                        const cIdx = cols.findIndex(c => c.toLowerCase() === colName.toLowerCase());
                        if (cIdx !== -1 && row.c[cIdx] && row.c[cIdx].v !== null && row.c[cIdx].v !== undefined) {
                            return row.c[cIdx].f ? row.c[cIdx].f : String(row.c[cIdx].v);
                        }
                        return "-";
                    };

                    const prodName = getVal("Product Name");
                    const compName = getVal("Company Name");

                    if (prodName === "-" && compName === "-") return;

                    products.push({
                        id: products.length + 1, // Auto-increment ID unik global
                        category: categoryName, // Inject kategori sumber sheet (Konven/Syariah/HS)
                        company: compName,
                        name: prodName,
                        channel: getVal("Distribution Channel"),
                        currency: getVal("Currency"),
                        par: getVal("Par/Non Par"),
                        productType: getVal("Product Type"),
                        
                        deathBenefit: getVal("Death Benefit"),
                        accidentalBenefit: getVal("Accidental Death Benefit"),
                        terminalIllness: getVal("Terminal Illness Benefit"),
                        saBonus: getVal("Sum Assured Bonus"),
                        cashPayout: getVal("Cash Payout Bonus"),
                        maturityBenefit: getVal("Maturity Benefit"),
                        
                        coveragePeriod: getVal("Coverage Period") !== "-" ? getVal("Coverage Period") : getVal("Coverage Term"),
                        ppp: getVal("Premium Payment Period (PPP)") !== "-" ? getVal("Premium Payment Period (PPP)") : getVal("Premium Term"),
                        entryAge: getVal("Entry Age"),
                        minPremium: getVal("Min Premium"),
                        minSumAssured: getVal("Min Sum Assured"),
                        underwriting: getVal("Underwriting Method"),
                        riders: getVal("Available Riders")
                    });
                });
            } catch (err) {
                console.error(`Error memproses tab ${categoryName}:`, err);
            }
        }

        function checkAllSheetsLoaded() {
            sheetsProcessed++;
            if (sheetsProcessed + sheetsFailed === SHEET_TABS.length) {
                if (products.length === 0) {
                    document.getElementById("loadingIndicator").innerHTML = `
                        <p class="text-red-500 font-semibold"><i class="fa-solid fa-triangle-exclamation me-1"></i> Data kosong atau tidak ada tab bernama Konven, Syariah, atau HS.</p>`;
                    return;
                }

                document.getElementById("loadingIndicator").classList.add("hidden");
                document.getElementById("deckGrid").classList.remove("hidden");
                
                populateAllDropdowns();
                currentlyVisibleProducts = [...products]; 
                renderDeck(currentlyVisibleProducts);
            }
        }

        function populateAllDropdowns() {
            buildDropdownUI('category', [...new Set(products.map(p => p.category))].filter(c => c));
            buildDropdownUI('company', [...new Set(products.map(p => p.company))].filter(c => c && c !== "-"));
            buildDropdownUI('type', [...new Set(products.map(p => p.productType))].filter(t => t && t !== "-"));
            buildDropdownUI('channel', [...new Set(products.map(p => p.channel))].filter(c => c && c !== "-"));
            buildDropdownUI('currency', [...new Set(products.map(p => p.currency))].filter(c => c && c !== "-"));
        }

        function getCategoryBadge(category) {
            if(category === "Konven") return `<span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">${category}</span>`;
            if(category === "Syariah") return `<span class="bg-green-100 text-green-800 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">${category}</span>`;
            return `<span class="bg-purple-100 text-purple-800 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">${category}</span>`; // HS
        }

        function renderDeck(data) {
            const grid = document.getElementById("deckGrid");
            document.getElementById("totalProductCount").textContent = `${data.length} Produk`;
            grid.innerHTML = "";

            if (data.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">Tidak ada produk ditemukan sesuai filter</div>`;
                return;
            }

            data.forEach(p => {
                const isSelected = selectedProductIds.includes(p.id);
                const card = document.createElement("div");
                card.className = `bg-white rounded-xl shadow-sm border ${isSelected ? 'border-blue-500 ring-2 ring-blue-200' : 'border-gray-200'} hover:shadow-md transition p-5 flex flex-col justify-between relative cursor-pointer`;
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-gray-100 text-gray-700 border border-gray-200">${p.company}</span>
                            <div class="flex flex-col items-end gap-1">
                                ${getCategoryBadge(p.category)}
                                <span class="text-xs text-gray-500 font-medium">${p.currency}</span>
                            </div>
                        </div>
                        <h3 class="font-bold text-gray-800 text-base mb-1" onclick="openDetailModal(${p.id})">${p.name}</h3>
                        <p class="text-xs text-gray-500 mb-3"><i class="fa-solid ${getChannelIcon(p.channel)} me-1"></i> ${p.channel} &bull; <span class="italic">${p.productType}</span></p>
                        
                        <div class="text-xs bg-gray-50 p-2.5 rounded-lg text-gray-600 mb-3 line-clamp-3">
                            <strong class="text-gray-800 block">Death Benefit:</strong> ${formatListText(p.deathBenefit)}
                        </div>
                    </div>

                    <div class="pt-3 border-t flex justify-between items-center text-xs">
                        <button onclick="openDetailModal(${p.id})" class="text-blue-600 hover:underline font-medium">Lihat Detail</button>
                        <button onclick="toggleSelectProduct(${p.id}, event)" class="px-3 py-1.5 rounded-lg border text-xs font-semibold flex items-center gap-1 ${isSelected ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 hover:bg-gray-50'}">
                            <i class="fa-solid ${isSelected ? 'fa-check' : 'fa-plus'}"></i> ${isSelected ? 'Dipilih' : 'Bandingkan'}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // LOGIKA FILTER MULTI-SELECT (Logic OR/AND khusus)
        function filterData() {
            const search = document.getElementById("searchInput").value.toLowerCase();

            currentlyVisibleProducts = products.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(search) || p.company.toLowerCase().includes(search);
                
                // Jika array filter kosong, artinya tampilkan semua (True). 
                // Jika ada isinya, cek apakah properti produk ada di dalam array filter tersebut.
                const matchCat  = activeFilters.category.length === 0 || activeFilters.category.includes(p.category);
                const matchComp = activeFilters.company.length === 0 || activeFilters.company.includes(p.company);
                const matchType = activeFilters.type.length === 0 || activeFilters.type.includes(p.productType);
                
                // Untuk Channel dan Currency (karena datanya bisa gabungan teks "IDR & USD"), 
                // kita gunakan 'some/includes' agar pencocokannya lebih luwes.
                const matchChan = activeFilters.channel.length === 0 || activeFilters.channel.some(f => p.channel.includes(f));
                const matchCurr = activeFilters.currency.length === 0 || activeFilters.currency.some(f => p.currency.includes(f));

                return matchSearch && matchCat && matchComp && matchType && matchChan && matchCurr;
            });
            renderDeck(currentlyVisibleProducts);
        }

        function toggleSelectProduct(id, e) {
            e.stopPropagation();
            if (selectedProductIds.includes(id)) { 
                selectedProductIds = selectedProductIds.filter(pid => pid !== id); 
            } else { 
                selectedProductIds.push(id); 
            }
            updateCompareBar();
            renderDeck(currentlyVisibleProducts); 
        }

        function selectAllVisible() {
            currentlyVisibleProducts.forEach(p => {
                if (!selectedProductIds.includes(p.id)) {
                    selectedProductIds.push(p.id);
                }
            });
            updateCompareBar();
            renderDeck(currentlyVisibleProducts);
        }

        function updateCompareBar() {
            const bar = document.getElementById("compareBar");
            document.getElementById("selectedCount").textContent = selectedProductIds.length;
            if (selectedProductIds.length > 0) {
                bar.classList.remove("translate-y-32");
            } else {
                bar.classList.add("translate-y-32");
            }
        }

        function clearSelection() { 
            selectedProductIds = []; 
            updateCompareBar(); 
            renderDeck(currentlyVisibleProducts);
        }

        function openComparisonModal() {
            const container = document.getElementById("modalTableContainer");
            currentComparisonProducts = products.filter(p => selectedProductIds.includes(p.id));

            const allFeatures = [
                { label: "Sistem Kategori", key: "category", isHighlight: false },
                { label: "Channel Distribusi", key: "channel", isHighlight: false },
                { label: "Tipe Produk", key: "productType", isHighlight: false },
                { label: "Masa Pembayaran (PPP)", key: "ppp", isHighlight: false },
                { label: "Masa Pertanggungan", key: "coveragePeriod", isHighlight: false },
                { label: "Usia Masuk", key: "entryAge", isHighlight: false },
                { label: "Min. Premi", key: "minPremium", isHighlight: false },
                { label: "Min. Uang Pertanggungan", key: "minSumAssured", isHighlight: false },
                { label: "Underwriting Method", key: "underwriting", isHighlight: false },
                
                { label: "Death Benefit", key: "deathBenefit", isHighlight: true },
                { label: "Accidental Death Benefit", key: "accidentalBenefit", isHighlight: true },
                { label: "Terminal Illness Benefit", key: "terminalIllness", isHighlight: true },
                { label: "Sum Assured Bonus", key: "saBonus", isHighlight: true },
                { label: "Cash Payout Bonus", key: "cashPayout", isHighlight: true },
                { label: "Maturity Benefit", key: "maturityBenefit", isHighlight: true },
                { label: "Available Riders", key: "riders", isHighlight: true }
            ];

            currentComparisonFeatures = allFeatures.filter(feat => {
                return currentComparisonProducts.some(p => !isEmptyVal(p[feat.key]));
            });

            container.innerHTML = `
                <table class="w-full text-sm text-left border-collapse min-w-[600px]" id="comparisonTable">
                    <thead>
                        <tr class="bg-gray-100 border-b">
                            <th class="p-3 font-semibold text-gray-700 w-48 sticky left-0 bg-gray-100 z-10 shadow-sm">Atribut / Fitur</th>
                            ${currentComparisonProducts.map(p => `
                                <th class="p-3 font-bold text-blue-900 border-l min-w-[240px]">
                                    <div class="text-xs text-blue-600 font-normal">${p.company}</div>
                                    ${p.name}
                                </th>
                            `).join('')}
                        </tr>
                    </thead>
                    <tbody class="divide-y">
                        ${currentComparisonFeatures.map(feat => {
                            const rowBgClass = feat.isHighlight 
                                ? 'font-bold text-blue-800 bg-blue-50 sticky left-0 shadow-sm border-t-2 border-blue-100' 
                                : 'font-medium text-gray-600 bg-gray-50 sticky left-0 shadow-sm';
                            const cellBgClass = feat.isHighlight ? 'text-xs bg-white border-t-2 border-blue-100' : '';

                            return `
                                <tr>
                                    <td class="p-3 ${rowBgClass}">${feat.label}</td>
                                    ${currentComparisonProducts.map(p => `
                                        <td class="p-3 border-l ${cellBgClass}">${formatListText(p[feat.key])}</td>
                                    `).join('')}
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById("compareModal").classList.remove("hidden");
        }

        function closeComparisonModal() { 
            document.getElementById("compareModal").classList.add("hidden"); 
        }

        function downloadComparisonExcel() {
            if (currentComparisonProducts.length === 0) return;
            let ws_data = [];
            
            let headers = ["Atribut / Fitur"];
            currentComparisonProducts.forEach(p => headers.push(p.company + " - " + p.name));
            ws_data.push(headers);

            currentComparisonFeatures.forEach(feat => {
                let rowData = [feat.label];
                currentComparisonProducts.forEach(p => {
                    let cellVal = p[feat.key];
                    if (isEmptyVal(cellVal)) cellVal = "-";
                    cellVal = String(cellVal).replace(/\r\n|\r|\n/g, '\n');
                    rowData.push(cellVal);
                });
                ws_data.push(rowData);
            });

            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Komparasi");

            const today = new Date().toISOString().split('T')[0];
            const fileName = `Komparasi_Asuransi_${today}.xlsx`;

            if (window.pywebview) {
                const b64Data = XLSX.write(wb, {type: 'base64', bookType: 'xlsx'});
                window.pywebview.api.save_excel(b64Data, fileName);
            } else {
                XLSX.writeFile(wb, fileName);
            }
        }

        function openDetailModal(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;

            document.getElementById("detailTitle").textContent = p.name;
            
            const allBenefits = [
                { label: "Death Benefit", val: p.deathBenefit },
                { label: "Accidental Death Benefit", val: p.accidentalBenefit },
                { label: "Terminal Illness Benefit", val: p.terminalIllness },
                { label: "Sum Assured Bonus", val: p.saBonus },
                { label: "Cash Payout Bonus", val: p.cashPayout },
                { label: "Maturity Benefit", val: p.maturityBenefit }
            ];

            let benefitsHTML = "";
            allBenefits.forEach(b => {
                if (!isEmptyVal(b.val)) {
                    benefitsHTML += `
                        <div class="mt-2">
                            <span class="benefit-label">${b.label}:</span>
                            <span class="benefit-value">${formatListText(b.val)}</span>
                        </div>
                    `;
                }
            });

            document.getElementById("detailBody").innerHTML = `
                <div class="detail-row"><span class="detail-label">Perusahaan:</span> ${p.company}</div>
                <div class="detail-row"><span class="detail-label">Kategori Sistem:</span> ${p.category}</div>
                <div class="detail-row"><span class="detail-label">Channel:</span> ${p.channel}</div>
                <div class="detail-row"><span class="detail-label">Tipe Produk:</span> ${p.productType}</div>
                <div class="detail-row"><span class="detail-label">Masa Asuransi:</span><br>${formatListText(p.coveragePeriod)}</div>
                <div class="detail-row"><span class="detail-label">Masa Bayar Premi:</span><br>${formatListText(p.ppp)}</div>
                <div class="detail-row"><span class="detail-label">Usia Masuk:</span><br>${formatListText(p.entryAge)}</div>
                
                ${!isEmptyVal(p.minPremium) ? `<div class="detail-row"><span class="detail-label">Min. Premi:</span><br>${formatListText(p.minPremium)}</div>` : ''}
                
                <div class="detail-row border-b-0 pb-0 mb-4"><span class="detail-label">Min. Uang Pertanggungan:</span> ${p.minSumAssured}</div>
                
                <div class="pt-4 border-t border-gray-200">
                    <h4 class="font-bold text-blue-800 text-base mb-1">Manfaat Asuransi</h4>
                    ${benefitsHTML}
                </div>
                
                ${!isEmptyVal(p.riders) ? `
                <div class="pt-4 mt-4 border-t border-gray-200">
                    <h4 class="font-bold text-blue-800 text-base mb-1">Available Riders</h4>
                    <div class="benefit-value">${formatListText(p.riders)}</div>
                </div>` : ''}
            `;
            document.getElementById("detailModal").classList.remove("hidden");
        }

        function closeDetailModal() { 
            document.getElementById("detailModal").classList.add("hidden"); 
        }
    </script>
</body>
</html>
